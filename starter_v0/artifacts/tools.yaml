# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
# `pytest tests/test_tool_contract.py` checks this sync for you.
#
# TODO CP2 (student):
#   - Rewrite every description: what it does, WHEN to use it, WHEN NOT to use it.
#   - Spell out arg conventions in parameter descriptions (handle format, topic/timeframe, search_type).
#   - Make the `send` confirmation boundary explicit.
#   - Declare your new tool(s) at the end of this file.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Hỏi lại người dùng khi thiếu thông tin bắt buộc để thực hiện yêu cầu (ví dụ: thiếu tên tài khoản, thiếu URL). Dùng thay vì tự đoán. Không dùng khi yêu cầu đã đủ thông tin."
    parameters:
      type: object
      properties:
        question:
          {
            type: string,
            default: "",
            description: "Một câu hỏi ngắn gọn gửi cho người dùng",
          }
        response_type:
          {
            type: string,
            enum: [text, yes_no, choice],
            default: "text",
            description: "Luôn truyền tham số này. text: hỏi để người dùng tự gõ câu trả lời (ví dụ xin tên tài khoản hoặc URL). yes_no: câu hỏi có/không. choice: chọn một trong các options.",
          }
        options:
          {
            type: array,
            default: [],
            items: { type: string },
            description: "Các lựa chọn, chỉ dùng khi response_type là choice",
          }
      required: [question, response_type]

  - name: timeline
    description: "Lấy các bài đăng gần đây."
    parameters:
      type: object
      properties:
        screenname: { type: string, default: "", description: "Tên tài khoản" }
        limit: { type: integer, default: 5, description: "Số lượng" }
      required: [screenname]

  - name: social_search
    description: "Tìm trên mạng xã hội."
    parameters:
      type: object
      properties:
        query: { type: string, default: "", description: "Từ khóa" }
        search_type:
          {
            type: string,
            enum: [Latest, Top],
            default: "Latest",
            description: "Cách sắp xếp",
          }
        limit: { type: integer, default: 5, description: "Số lượng" }
      required: [query]

  - name: lookup
    description: "Tra cứu thông tin trên internet."
    parameters:
      type: object
      properties:
        query:
          { type: string, default: "", description: "Chủ đề của thông tin" }
        topic:
          {
            type: string,
            enum: [general, news],
            default: "general",
            description: "Phân loại",
          }
        timeframe:
          {
            type: string,
            enum: [day, week, month, year],
            default: "week",
            description: "Khoảng thời gian",
          }
        max_results: { type: integer, default: 5, description: "Số kết quả" }
      required: [query]

  - name: fetch
    description: "Lấy nội dung từ một địa chỉ."
    parameters:
      type: object
      properties:
        url: { type: string, default: "", description: "Địa chỉ" }
      required: [url]

  - name: format
    description: "Trình bày dữ liệu đã có thành văn bản."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: { type: string }
              url: { type: string }
              source: { type: string }
              summary: { type: string }
              section: { type: string }
        template:
          {
            type: string,
            enum: [brief, sections, bullets, thread, daily_ai_vn],
            default: "sections",
            description: "Khuôn",
          }
        headline: { type: string, default: "", description: "Tiêu đề" }
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Gửi một đoạn văn bản đi."
    parameters:
      type: object
      properties:
        text: { type: string, default: "", description: "Nội dung" }
        confirmed: { type: boolean, default: false, description: "Cờ xác nhận" }
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu nội bộ."
    parameters:
      type: object
      properties:
        query: { type: string, default: "", description: "Truy vấn" }
        policy_area:
          {
            type: string,
            enum:
              [
                all,
                ai_research,
                source_citation,
                data_privacy,
                external_publishing,
                tool_usage,
              ],
            default: "all",
            description: "Nhóm",
          }
        top_k: { type: integer, default: 3, description: "Số mục" }
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học."
    parameters:
      type: object
      properties:
        query: { type: string, default: "", description: "Từ khóa" }
        max_results: { type: integer, default: 5, description: "Số lượng" }
        sort_by:
          {
            type: string,
            enum: [relevance, lastUpdatedDate, submittedDate],
            default: "relevance",
            description: "Sắp xếp",
          }
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của một bài báo."
    parameters:
      type: object
      properties:
        arxiv_url: { type: string, default: "", description: "ID hoặc địa chỉ" }
        max_pages: { type: integer, default: 5, description: "Số trang" }
        max_chars: { type: integer, default: 8000, description: "Số ký tự" }
      required: [arxiv_url]

  # ---------------- Team tool (CP3) ----------------
  - name: research_export
    description: >-
      Xuất danh sách nguồn đã có thành nội dung file Markdown hoặc CSV để tải xuống.
      Dùng khi người dùng yêu cầu xuất file; dùng format khi chỉ cần trình bày trong chat.
      Không tìm kiếm, đọc URL, gửi dữ liệu hay tự lưu file. Chỉ dùng items có thật từ
      người dùng hoặc kết quả tool; nếu thiếu dữ liệu, hỏi lại hoặc thu thập nguồn trước.
    parameters:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          minItems: 1
          description: "Nguồn đã có; mỗi item cần title và URL HTTP(S); giữ nguyên nội dung nguồn."
          items:
            type: object
            properties:
              title: { type: string, minLength: 1, description: "Tiêu đề nguồn" }
              url: { type: string, minLength: 1, description: "URL nguồn HTTP(S)" }
              source: { type: string, description: "Tên nguồn; bỏ trống sẽ dùng domain URL" }
              summary: { type: string, description: "Tóm tắt hoặc ghi chú đã có; không tự thêm dữ kiện" }
            required: [title, url]
        output_format:
          type: string
          enum: [markdown, csv]
          default: markdown
          description: "Định dạng file theo yêu cầu người dùng, mặc định markdown"
        title:
          type: string
          default: ""
          description: "Tiêu đề Markdown; không dùng trong CSV"
      required: [items]

  - name: send_document
    description: >-
      Yêu cầu gửi file research_export đã có tới private channel Telegram của nhóm.
      Dùng artifact_id đúng từ phiên; không nhận đường dẫn hoặc tự tạo nội dung file.
      Gọi confirmed=false để runtime hỏi xác nhận đúng file và đích gửi; chỉ runtime
      thực thi sau một lượt xác nhận riêng. Không dùng khi chỉ tải file hoặc gửi text.
    parameters:
      type: object
      additionalProperties: false
      properties:
        artifact_id: { type: string, description: "ID file từ kết quả research_export hoặc SESSION_DATA.exports" }
        caption: { type: string, default: "", maxLength: 1024, description: "Chú thích gửi kèm, sẽ hiển thị khi xác nhận" }
        confirmed: { type: boolean, default: false, description: "Model luôn dùng false; runtime xác thực lượt xác nhận trước khi dùng true" }
      required: [artifact_id]
